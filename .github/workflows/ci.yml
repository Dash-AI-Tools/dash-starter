name: CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The signing key of the ephemeral databases of the pipeline. It protects
  # nothing: the data of the pipeline lives and dies with the job.
  APP_KEY: ci-only-0123456789abcdef0123456789abcdef
  CREEM_ENV: test
  AI_PROVIDER: stub

jobs:
  lint-typecheck:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check the formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

  test:
    name: Unit and functional tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dash
          POSTGRES_PASSWORD: dash
          POSTGRES_DB: dash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dash -d dash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3333
      HOST: localhost
      LOG_LEVEL: info
      APP_URL: http://localhost:3333
      WEB_URL: http://localhost:5173
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: dash
      DB_PASSWORD: dash
      DB_DATABASE: dash_test
      MAIL_FROM: Dash <no-reply@dash-starter.test>
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run the migrations
        run: node ace migration:run --force
        working-directory: apps/api

      - name: Run the tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      PORT: 3333
      HOST: localhost
      LOG_LEVEL: info
      APP_URL: http://localhost:3333
      WEB_URL: http://localhost:5173
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: dash
      DB_PASSWORD: dash
      DB_DATABASE: dash
      MAIL_FROM: Dash <no-reply@dash-starter.test>
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    env:
      E2E_WEB_URL: http://localhost:5174
      E2E_MAILPIT_URL: http://localhost:8026
      E2E_CREEM_WEBHOOK_SECRET: e2e-webhook-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d

      - name: Prepare the database
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml exec -T api node ace migration:run --force
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml exec -T api node ace db:seed

      - name: Wait for the stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --wait

      - name: Run the journeys
        run: npm run test:e2e

      - name: Upload the traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7
