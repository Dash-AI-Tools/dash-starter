name: CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The environment of the API. The jobs that need a database override the
  # name of it. The signing key protects nothing: the data of the pipeline
  # lives and dies with the job.
  APP_KEY: ci-only-0123456789abcdef0123456789abcdef
  CREEM_ENV: test
  AI_PROVIDER: stub
  PORT: 3333
  HOST: localhost
  LOG_LEVEL: info
  APP_URL: http://localhost:3333
  WEB_URL: http://localhost:5173
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USER: dash
  DB_PASSWORD: dash
  SESSION_DRIVER: database
  DEFAULT_LOCALE: en
  MAIL_TRANSPORT: fake
  DRIVE_DISK: local
  LIMITER_STORE: memory
  MAIL_FROM: Dash <no-reply@dash-starter.test>

jobs:
  lint-typecheck:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generate the types of the API
        run: node ace codegen
        working-directory: apps/api

      - name: Check the formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

  test:
    name: Unit and functional tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dash
          POSTGRES_PASSWORD: dash
          POSTGRES_DB: dash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dash -d dash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_DATABASE: dash_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generate the types of the API
        run: node ace codegen
        working-directory: apps/api

      - name: Run the migrations
        run: node ace migration:run --force
        working-directory: apps/api

      - name: Run the tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      DB_DATABASE: dash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    env:
      E2E_WEB_URL: http://localhost:5174
      E2E_MAILPIT_URL: http://localhost:8026
      E2E_CREEM_WEBHOOK_SECRET: e2e-webhook-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d

      - name: Wait for the stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --wait --wait-timeout 900

      - name: Seed the plans
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml exec -T api node ace db:seed

      - name: Run the journeys
        run: npm run test:e2e

      - name: Upload the traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7

  installer:
    name: Installer
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dash
          POSTGRES_PASSWORD: dash
          POSTGRES_DB: dash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dash -d dash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_DATABASE: dash_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generate a project
        run: >
          node packages/create-app/bin/create-dash-starter.js "$RUNNER_TEMP/project"
          --template . --name "Acme AI" --slug acme-ai --locale es --palette forest
          --yes --no-install --no-boot --no-git

      - name: Check the palette and the demo mode of the project
        working-directory: ${{ runner.temp }}/project
        run: |
          grep -q "DEFAULT_PALETTE: PaletteId = 'forest'" apps/web/src/lib/palettes.ts
          grep -qx "DEMO_MODE=false" .env
          grep -qx "DEMO_MODE=false" .env.example

      - name: Install the dependencies of the project
        working-directory: ${{ runner.temp }}/project
        run: npm install

      - name: Generate the types of the API of the project
        working-directory: ${{ runner.temp }}/project/apps/api
        run: node ace codegen

      - name: Run the migrations of the project
        working-directory: ${{ runner.temp }}/project/apps/api
        run: node ace migration:run --force

      - name: Lint, type-check and test the project
        working-directory: ${{ runner.temp }}/project
        run: |
          npm run lint
          npm run typecheck
          npm test
