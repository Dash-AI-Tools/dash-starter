# Development stack. The whole repository is mounted so npm workspaces and the
# hot-reload boundaries work exactly as they do on the host. Dependencies live
# in named volumes so the container installs Linux binaries and never writes
# into the host `node_modules`.
#
# The name of the project and the ports the host publishes are variables, so a
# worktree can run its own stack next to this one. The defaults are the ones
# the template has always used. `COMPOSE_PROJECT_NAME` is the override of
# Compose itself and wins over everything; `DEV_COMPOSE_PROJECT_NAME` is the
# name of the development stack alone, so the end-to-end stack of the same
# worktree keeps its own.
name: ${COMPOSE_PROJECT_NAME:-${DEV_COMPOSE_PROJECT_NAME:-dash-starter}}
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dash
      POSTGRES_PASSWORD: dash
      POSTGRES_DB: dash
    ports:
      - '${DB_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dash -d dash']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '${MAILPIT_HOST_PORT:-8025}:8025' # web UI
      - '${SMTP_HOST_PORT:-1025}:1025' # SMTP
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8025/readyz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: node:24.22.1-alpine
    working_dir: /app/apps/api
    command: >
      sh -c "cd /app && npm ci --workspace @dash/api --include-workspace-root &&
      cd /app/apps/api && node ace codegen && node ace migration:run --force &&
      node ace serve --hmr"
    environment:
      TZ: UTC
      PORT: 3333
      HOST: 0.0.0.0
      NODE_ENV: development
      APP_URL: http://localhost:${API_HOST_PORT:-3333}
      WEB_URL: http://localhost:${WEB_HOST_PORT:-5173}
      APP_KEY: ${APP_KEY:?set APP_KEY in the root .env}
      # The database lives in the `db` service, not on the host.
      DB_HOST: db
      DB_PORT: 5432
      MAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      # The host `apps/api/.env` points at the host database, so the container
      # reads its own file instead.
      - ./apps/api/.env.docker:/app/apps/api/.env:ro
    ports:
      - '${API_HOST_PORT:-3333}:3333'
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3333/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      # The container installs the dependencies and runs the migrations before
      # it serves, so the first probe needs a wide window: a machine without a
      # warm volume spends several minutes in the installation.
      start_period: 300s

  web:
    image: node:24.22.1-alpine
    working_dir: /app/apps/web
    command: >
      sh -c "cd /app && npm ci --workspace @dash/web --include-workspace-root &&
      cd /app/apps/web && npm run dev -- --host 0.0.0.0"
    environment:
      # The dev server proxies `/api` and `/mcp` to the API container, so the
      # browser only ever talks to one origin.
      API_URL: http://api:3333
      # Shows the palette picker; off unless the root `.env` sets DEMO_MODE=true.
      VITE_DEMO_MODE: ${DEMO_MODE:-false}
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    ports:
      - '${WEB_HOST_PORT:-5173}:5173'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5173/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      # The container installs the dependencies before it serves.
      start_period: 300s

volumes:
  pgdata:
  api_node_modules:
  web_node_modules:
