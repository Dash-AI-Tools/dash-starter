name: dash-starter

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dash
      POSTGRES_PASSWORD: dash
      POSTGRES_DB: dash
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dash -d dash"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  api:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && node ace serve --hmr"
    environment:
      TZ: UTC
      PORT: 3333
      HOST: 0.0.0.0
      NODE_ENV: development
      LOG_LEVEL: info
      APP_KEY: ${APP_KEY:?set APP_KEY in .env (node ace generate:key --force)}
      APP_URL: http://localhost:3333
      SESSION_DRIVER: cookie
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: dash
      DB_PASSWORD: dash
      DB_DATABASE: dash
      MAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: "Dash <no-reply@dash-starter.test>"
      AI_PROVIDER: stub
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_URL: http://api:3333
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  api_node_modules:
  web_node_modules:
